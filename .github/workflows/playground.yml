name: Playground demo

# Builds the theme, packages the theme + plugin as zips, and publishes them with
# the Playground blueprint to the `playground` branch. The live demo link in the
# README loads that blueprint, so the demo always matches the latest `main`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playground
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build theme assets
        working-directory: 01-research-lab-theme/coastal-lab
        run: npm ci && npm run build

      - name: Package theme, plugin and blueprint
        run: |
          mkdir -p dist
          (cd 01-research-lab-theme && zip -rq ../dist/coastal-lab.zip coastal-lab \
            -x 'coastal-lab/node_modules/*' 'coastal-lab/src/*' 'coastal-lab/package*.json' \
               'coastal-lab/webpack.config.js' 'coastal-lab/.stylelintrc.json')
          (cd 02-campus-directory-plugin && zip -rq ../dist/campus-directory.zip campus-directory)
          cp playground/blueprint.json playground/demo-setup.php playground/demo-content.php dist/

      - name: Publish to playground branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b playground
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Playground demo build from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" playground
